# Per-library manifest: applies ONLY to units under test/libmanifest/.
# The whole point is what it CANNOT reach — the program that uses these units,
# and the sibling library next door.
define  MANIFEST_ON
undef   PROGDEF
mode    delphi
unitalias  Scoped.Alias=libmanifest_alias

# Deliberately NO row for Scoped.NoSuchRow: test/libmanifest/unitalias_no_row.pas
# must still fail, which is what separates a TABLE from "strip any dotted
# prefix". A prefix strip would resolve it to `nosuchrow` and then to whatever
# happened to be on the search path.

notadirective  something   # must warn and be ignored, not abort the compile
